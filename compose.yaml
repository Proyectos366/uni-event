services:
  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - sqlite-data:/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - sqlite-data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite-data:
